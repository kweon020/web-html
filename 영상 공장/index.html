<style>
/* Layout: a studio catalogue. Sticky filter bar over a card grid; picking a card raises a clapperboard-striped order slip from the bottom. */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --fg: #15171c;
  --muted: #5a616d;
  --line: #d8dce3;
  --chip: #e2e5ea;
  --accent: #ffcb2e;          /* slate yellow */
  --accent-ink: #15171c;      /* text on accent */
  --accent-text: #7a5a00;     /* accent used as text on bg */
  --ok: #1f7a4d;
  --shadow: 0 10px 30px rgba(20, 24, 33, .16);
  --f-display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1a1d23; --fg: #eceef2; --muted: #9aa1ad; --line: #2a2f38; --chip: #23272f;
    --accent: #ffcb2e; --accent-ink: #15171c; --accent-text: #ffd65c; --ok: #5fd39a;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1a1d23; --fg: #eceef2; --muted: #9aa1ad; --line: #2a2f38; --chip: #23272f;
  --accent: #ffcb2e; --accent-ink: #15171c; --accent-text: #ffd65c; --ok: #5fd39a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.55 var(--f-body);
  word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg);
}
.wrap {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- header ---------- */
header { padding-block: 28px 14px; }
.head-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.mark {
  width: 46px; height: 46px; flex: none; border-radius: 8px; background: var(--fg);
  position: relative; overflow: hidden;
}
.mark::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 15px;
  background: repeating-linear-gradient(-45deg, var(--accent) 0 7px, var(--fg) 7px 14px);
}
.mark::after {
  content: ""; position: absolute; left: 9px; right: 9px; bottom: 9px; height: 13px;
  border-top: 2px solid var(--bg); border-bottom: 2px solid var(--bg); opacity: .55;
}
h1 { font: 400 clamp(30px, 5vw, 42px)/1 var(--f-display); margin: 0; letter-spacing: -.01em; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.sub b { color: var(--fg); font-weight: 600; }
.search {
  position: relative; flex: 1 1 280px; max-width: 420px;
}
.search input {
  width: 100%; height: 46px; padding: 0 40px 0 42px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
}
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.search .clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 18px;
}
.search .clear:hover { background: var(--chip); color: var(--fg); }

/* ---------- filter bar ---------- */
.filters {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.chips {
  display: flex; gap: 8px; overflow-x: auto; padding-block: 12px; scrollbar-width: thin;
}
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px;
  border-radius: 999px; border: 1px solid transparent; background: var(--chip); cursor: pointer; white-space: nowrap;
  font-size: 14px; font-weight: 500;
}
.chip:hover { border-color: var(--line); }
.chip .ct { font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.chip[aria-pressed="true"] .ct { color: var(--accent); }

.status { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 16px 4px; color: var(--muted); font-size: 13px; }
.status b { color: var(--fg); font-variant-numeric: tabular-nums; }
.legend { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- grid ---------- */
main { padding-block: 8px 48px; }
body.docked main { padding-bottom: 330px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 18px; }
.card {
  display: flex; flex-direction: column; text-align: left; padding: 0; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; min-width: 0;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--chip); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.num {
  position: absolute; left: 8px; top: 8px; padding: 2px 7px; border-radius: 4px;
  background: rgba(10, 11, 14, .72); color: #fff; font: 500 11px var(--f-mono); letter-spacing: .04em;
}
.gen {
  position: absolute; right: 8px; top: 8px; padding: 2px 8px; border-radius: 4px;
  background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600;
}
.body { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 14px; flex: 1; min-width: 0; }
.cat { font-size: 12px; color: var(--accent-text); font-weight: 600; letter-spacing: .02em; }
.name { font: 400 21px/1.2 var(--f-display); margin: 0; text-wrap: balance; }
.en { font-size: 12px; color: var(--muted); margin-top: -3px; }
.uses { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.uses span { font-size: 12px; padding: 2px 8px; border-radius: 5px; background: var(--chip); color: var(--fg); }
.empty { padding: 64px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font: 400 24px var(--f-display); margin-bottom: 6px; }

/* ---------- order slip (dock) ---------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--surface); box-shadow: 0 -12px 40px rgba(0, 0, 0, .22);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transform: translateY(0); transition: transform .25s ease;
}
.dock[hidden] { display: block !important; transform: translateY(110%); visibility: hidden; }
.stripe { height: 12px; background: repeating-linear-gradient(-45deg, var(--fg) 0 12px, var(--accent) 12px 24px); }
.dock .wrap { padding-block: 16px 18px; max-height: min(70vh, 520px); overflow-y: auto; }
.slip { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px 24px; align-items: start; }
.pick { display: flex; flex-direction: column; gap: 8px; min-width: 0; grid-row: span 2; }
.pick img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; display: block; background: var(--chip); }
.pick .meta { font: 500 11px var(--f-mono); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.pick .title { font: 400 24px/1.15 var(--f-display); margin: 0; }
.close {
  position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 22px;
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1;
}
.close:hover { background: var(--chip); }
.fields { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 14px 20px; align-items: end; padding-right: 44px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lab { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.field input[type="text"] {
  height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); width: 100%;
}
.field input[type="text"].warn { border-color: #d9443a; box-shadow: 0 0 0 3px color-mix(in srgb, #d9443a 25%, transparent); }
.len-row { display: flex; align-items: center; gap: 12px; height: 44px; }
.len-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.len-val { font: 500 18px var(--f-mono); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
.len-val small { font-size: 12px; color: var(--muted); margin-left: 2px; }
.ratios { display: flex; gap: 6px; }
.ratio {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  width: 64px; height: 52px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer;
  font: 500 12px var(--f-mono);
}
.ratio i { display: block; border: 2px solid currentColor; border-radius: 2px; }
.ratio[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.ratio[aria-pressed="true"] i { border-color: var(--accent); }

.out { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; grid-column: 2; }
.sentence {
  flex: 1 1 320px; min-width: 0; margin: 0; padding: 12px 14px; border-radius: 8px;
  background: var(--bg); border: 1px dashed var(--line); font-size: 15px; line-height: 1.5;
  user-select: all; -webkit-user-select: all;
}
.sentence mark { background: none; color: var(--accent-text); font-weight: 600; }
.sentence .ph { color: var(--muted); font-weight: 400; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 8px;
  font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; border: 1px solid transparent;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--fg); }
.btn.ghost:hover { background: var(--chip); }
.btn svg { width: 16px; height: 16px; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); z-index: 60;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500;
  transition: opacity .2s, transform .2s; width: max-content; max-width: calc(100vw - 32px); text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.dock:not([hidden]) ~ .toast { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 24px); }

@media (max-width: 880px) {
  .slip { grid-template-columns: 1fr; }
  .pick { flex-direction: row; align-items: center; gap: 12px; padding-right: 44px; grid-row: auto; }
  .pick img { width: 112px; flex: none; }
  .fields { grid-template-columns: 1fr; padding-right: 0; }
  .out { grid-column: 1; }
  body.docked main { padding-bottom: 560px; }
}
@media (max-width: 480px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .name { font-size: 18px; }
  .uses span:nth-child(n+3) { display: none; }
  .btn { flex: 1; justify-content: center; }
  .btns { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>

  </div>
</section>

.jpg","demo":"https://lemomo-ai.github.io/lemo-opuscar/styles/map-explainer/"},{"s":"pip-simulation","n":"99","ko":"블롭 시뮬레이션","en":"Blob Simulation","cn":"小人模拟实验","aka":[],"c":"Data & Maps","ck":"데이터·지도","u":["진화·자연선택","게임이론·행위자 모델","전염병·대기열·시장"],"ue":["Evolution and natural selection","Game theory and agent-based models","Epidemics, queues and markets"],"film":"Is Faster Better?","line":"160 flocked Pips race for beans: the fast ones eat first and run dry first, and after 20 generations the board turns blue.","dur":52,"gen":false,"img":"thumbs/pip-simulation.jpg","demo":"https://lemomo-ai.github.io/lemo-opuscar/styles/pip-simulation/"}],"cats":[{"id":"Edit & Documentary","ko":"편집·다큐","count":8},{"id":"Painting & Illustration","ko":"회화·일러스트","count":5},{"id":"Sketch & Board","ko":"스케치·판서","count":7},{"id":"Traditional Crafts","ko":"전통 공예","count":7},{"id":"Print & Printmaking","ko":"인쇄·판화","count":8},{"id":"Graphic & Type","ko":"그래픽·타이포","count":8},{"id":"Line Diagrams","ko":"선 도해","count":8},{"id":"Cartoons","ko":"카툰","count":6},{"id":"Games","ko":"게임","count":4},{"id":"Film & Tape","ko":"필름·테이프","count":5},{"id":"Screens & Interfaces","ko":"화면·인터페이스","count":6},{"id":"Light & Lines","ko":"빛·선","count":5},{"id":"3D & Miniature","ko":"3D·미니어처","count":8},{"id":"Instruments & Evidence","ko":"계측·증거","count":8},{"id":"Data & Maps","ko":"데이터·지도","count":6}]};
  var S = DATA.styles, C = DATA.cats;
  var $ = function (id) { return document.getElementById(id); };
  var state = { cat: 'all', q: '', sel: null, ratio: '9:16', len: 40 };

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function norm(t) { return String(t).toLowerCase().replace(/\s+/g, ''); }
  S.forEach(function (s) {
    s.hay = norm([s.ko, s.en, s.cn, s.s, s.ck, s.c, s.film, s.line].concat(s.aka, s.u, s.ue).join('|'));
  });

  $('total').textContent = S.length;

  // category chips
  var chips = $('chips');
  var all = [{ id: 'all', ko: '전체', count: S.length }].concat(C);
  chips.innerHTML = all.map(function (c) {
    return '<button class="chip" type="button" data-cat="' + esc(c.id) + '" aria-pressed="' + (c.id === 'all') + '">' +
      esc(c.ko) + '<span class="ct">' + c.count + '</span></button>';
  }).join('');
  chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    state.cat = b.dataset.cat;
    chips.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    render();
  });

  // cards
  var grid = $('grid');
  grid.innerHTML = S.map(function (s, i) {
    return '<button class="card" type="button" data-i="' + i + '" aria-pressed="false">' +
      '<div class="thumb">' + (s.img ? '<img src="' + esc(s.img) + '" alt="' + esc(s.ko) + ' 예시 장면" loading="lazy" width="480" height="270">' : '') +
      '<span class="num">No.' + esc(s.n) + '</span>' + (s.gen ? '<span class="gen" title="이미지 생성기가 따로 필요해요">✦ 생성기</span>' : '') + '</div>' +
      '<div class="body"><span class="cat">' + esc(s.ck) + '</span>' +
      '<p class="name">' + esc(s.ko) + '</p><span class="en">' + esc(s.en) + '</span>' +
      '<div class="uses">' + s.u.map(function (u) { return '<span>' + esc(u) + '</span>'; }).join('') + '</div></div></button>';
  }).join('');
  var cards = grid.querySelectorAll('.card');

  function render() {
    var q = norm(state.q), n = 0;
    S.forEach(function (s, i) {
      var show = (state.cat === 'all' || s.c === state.cat) && (!q || s.hay.indexOf(q) !== -1);
      cards[i].hidden = !show; if (show) n++;
    });
    var catName = state.cat === 'all' ? '전체' : C.filter(function (c) { return c.id === state.cat; })[0].ko;
    $('count').innerHTML = esc(catName) + (state.q ? ' · “' + esc(state.q) + '”' : '') + ' — <b>' + n + '</b>개 화풍';
    $('empty').hidden = n > 0;
    $('clear').hidden = !state.q;
  }

  var q = $('q');
  q.addEventListener('input', function () { state.q = q.value.trim(); render(); });
  $('clear').addEventListener('click', function () { q.value = ''; state.q = ''; render(); q.focus(); });

  // order slip
  var dock = $('dock'), topic = $('topic'), len = $('len');
  grid.addEventListener('click', function (e) {
    var c = e.target.closest('.card'); if (!c) return;
    select(+c.dataset.i);
  });
  function select(i) {
    state.sel = S[i];
    cards.forEach(function (c) { c.setAttribute('aria-pressed', +c.dataset.i === i); });
    var s = state.sel;
    $('d-img').src = s.img || ''; $('d-img').alt = s.ko + ' 예시 장면';
    $('d-meta').textContent = 'No.' + s.n + ' · ' + s.ck + (s.dur ? ' · 데모 ' + s.dur + '초' : '');
    $('d-name').textContent = s.ko;
    $('demo').href = s.demo;
    $('demo').setAttribute('aria-label', s.ko + ' 데모 영상 보기 (새 탭)');
    var wasHidden = dock.hidden;
    dock.hidden = false; document.body.classList.add('docked');
    update();
    if (wasHidden) setTimeout(function () { topic.focus({ preventScroll: true }); }, 60);
  }
  function closeDock() {
    dock.hidden = true; document.body.classList.remove('docked');
    cards.forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });
    state.sel = null;
  }
  $('close').addEventListener('click', closeDock);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !dock.hidden) closeDock(); });

  len.addEventListener('input', function () { state.len = +len.value; update(); });
  topic.addEventListener('input', function () { topic.classList.remove('warn'); update(); });
  document.querySelectorAll('.ratio').forEach(function (b) {
    b.addEventListener('click', function () {
      state.ratio = b.dataset.r;
      document.querySelectorAll('.ratio').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
      update();
    });
  });

  // 9:16 → "으로" (육), 16:9 → "로" (구), 1:1 → "로" (일, ㄹ)
  function josa(r) { return r === '9:16' ? '으로' : '로'; }
  function sentence(t) {
    var s = state.sel;
    return s.ko + ' 화풍으로 ' + (t || '△△') + ' 주제 ' + state.len + '초 영상을 ' + state.ratio + josa(state.ratio) + ' 만들어줘';
  }
  function update() {
    if (!state.sel) return;
    $('len-val').innerHTML = state.len + '<small>초</small>';
    var t = topic.value.trim(), s = state.sel;
    $('sentence').innerHTML = '<mark>' + esc(s.ko) + '</mark> 화풍으로 ' +
      (t ? '<mark>' + esc(t) + '</mark>' : '<mark class="ph">(주제)</mark>') +
      ' 주제 <mark>' + state.len + '초</mark> 영상을 <mark>' + state.ratio + '</mark>' + josa(state.ratio) + ' 만들어줘';
  }

  var toastT;
  function toast(msg) {
    var el = $('toast'); el.textContent = msg; el.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, 2200);
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (ok) { toast('복사했어요. 붙여넣기 하세요.'); return; }
    var r = document.createRange(); r.selectNodeContents($('sentence'));
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast('자동 복사가 막혀 있어요. 선택된 문장을 Ctrl+C(⌘C)로 복사하세요.');
  }
  $('copy').addEventListener('click', function () {
    var t = topic.value.trim();
    if (!t) { topic.classList.add('warn'); topic.focus(); toast('영상 주제를 먼저 적어 주세요.'); return; }
    var text = sentence(t);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('복사했어요. 붙여넣기 하세요.'); }, function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  });

  render();
})();
</script>
